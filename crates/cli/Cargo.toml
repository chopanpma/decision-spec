[package]
name = "decispec"
version = "0.1.0"
edition = "2024"
description = "DecisionSpec CLI: spec-driven compliance compiler and gate"

[dependencies]
decispec-ir = { path = "../ir" }
decispec-parse = { path = "../parse" }
decispec-codegen = { path = "../codegen" }
